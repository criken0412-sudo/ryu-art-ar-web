<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="北澤龍の絵をカメラで映すと、作品が動き出すWebAR体験。" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/app-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>北澤龍の動く絵</title>
  </head>
  <body>
    <div id="app">
      <main id="home" class="home-screen">
        <header class="topbar">
          <img class="brand-icon" src="%BASE_URL%assets/app-icon.png" alt="" />
          <a class="site-link" href="https://www.ryukitazawa.com/works-1" target="_blank" rel="noreferrer">
            RYU KITAZAWA <span aria-hidden="true">↗</span>
          </a>
        </header>
        <section class="home-art" aria-label="北澤龍の作品">
          <div class="home-art-frame">
            <img class="home-art-image" src="%BASE_URL%assets/start-background.jpg" alt="金色の線で描かれた龍と街" />
            <img class="home-art-glow" src="%BASE_URL%assets/start-background.jpg" alt="" aria-hidden="true" />
            <span class="home-art-shine" aria-hidden="true"></span>
            <span class="glint glint-a" aria-hidden="true">✦</span>
            <span class="glint glint-b" aria-hidden="true">✦</span>
            <span class="glint glint-c" aria-hidden="true">✧</span>
          </div>
        </section>
        <nav class="home-actions" aria-label="メインメニュー">
          <button id="camera-open" class="camera-button"><span aria-hidden="true">⌾</span> 絵にカメラを向ける</button>
          <div class="secondary-actions">
            <button id="gallery-open" class="text-button">作品</button>
            <button id="help-open" class="text-button">使い方</button>
          </div>
        </nav>
      </main>

      <main id="gallery" class="gallery-screen hidden">
        <header class="subpage-header">
          <button class="back-button" data-go-home aria-label="ホームへ戻る">‹</button>
          <h1>作品</h1>
          <span></span>
        </header>
        <div id="artwork-grid" class="artwork-grid"></div>
      </main>

      <main id="detail" class="detail-screen hidden">
        <header class="subpage-header">
          <button class="back-button" data-go-gallery aria-label="作品一覧へ戻る">‹</button>
          <h1 id="detail-title"></h1>
          <span></span>
        </header>
        <div class="detail-image-wrap"><img id="detail-image" alt="作品画像" /></div>
      </main>

      <main id="help" class="help-screen hidden">
        <header class="subpage-header">
          <button class="back-button" data-go-home aria-label="ホームへ戻る">‹</button>
          <h1>使い方</h1>
          <span></span>
        </header>
        <div class="help-copy">
          <p>「絵にカメラを向ける」を押してカメラを許可し、作品全体を画面に映してください。</p>
          <p>作品2〜5は繰り返し再生します。作品4・5は約2秒かけて映像に切り替わります。</p>
          <p>カメラ映像はこの端末のブラウザ内で処理し、保存や送信はしません。</p>
          <a href="https://www.ryukitazawa.com/works-1" target="_blank" rel="noreferrer">北澤龍 公式作品ページ ↗</a>
        </div>
      </main>

      <section id="camera-screen" class="camera-screen hidden" aria-label="カメラ">
        <div id="ar-container" class="ar-container"></div>
        <div class="camera-shade"></div>
        <button id="camera-close" class="camera-control close-control" aria-label="閉じる">×</button>
        <p id="camera-status" class="camera-status">絵の全体を映してください</p>
        <button id="replay-button" class="camera-control replay-control hidden" aria-label="もう一度再生">↻</button>
        <button id="camera-start" class="camera-start-button">カメラをはじめる</button>
        <button id="enable-sound" class="sound-control hidden" aria-label="音声を有効にする">♫</button>
      </section>
      <aside id="toast" class="toast hidden" role="status"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
